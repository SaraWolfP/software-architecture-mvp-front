# nginx.conf
# Configuração do servidor que entrega a interface e conversa com a API.
#
# O bloco /api/ é o que permite à interface usar caminhos relativos em vez de
# apontar para uma porta do host. Três ganhos: nada de CORS, nada de depender
# da porta 5000 estar livre na máquina de quem avalia (no macOS o AirPlay a
# ocupa por padrão), e a comunicação entre os containers acontece pela rede
# interna do Docker.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão dos textos servidos.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Proxy para a API ────────────────────────────────────────────────────
    # "api" é o nome do serviço no docker-compose e resolve pelo DNS interno.
    location /api/ {
        proxy_pass http://api:5000/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A consulta ao Banco Central pode demorar na primeira carga,
        # antes de o cache local estar populado.
        proxy_connect_timeout 15s;
        proxy_read_timeout    30s;
    }

    # ── Arquivos estáticos ──────────────────────────────────────────────────
    # As bibliotecas de vendor/ são versionadas e podem ser cacheadas com folga.
    # O "^~" é necessário: sem ele, a regex de .css/.js abaixo venceria este
    # bloco e as bibliotecas perderiam o cache longo.
    location ^~ /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # O código da aplicação muda a cada deploy: revalida sempre.
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
